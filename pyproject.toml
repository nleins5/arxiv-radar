[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-radar"
version = "0.1.0"
description = "Batch and streaming PySpark pipeline that turns arXiv metadata into a local lakehouse and trend reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=4.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
